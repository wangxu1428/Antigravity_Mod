name: offline-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Host unit tests
        run: node tests/test_host_unit.js
      - name: Reaper unit tests
        run: node tests/test_reaper_unit.js
      - name: Update lock tests
        run: node tests/test_update_lock.js
      - name: Repatch unit tests
        run: node tests/test_repatch_unit.js
      - name: Fault injection tests
        run: node tests/test_fault_injection.js
      - name: Manifest raw-byte integrity tests
        run: node tests/test_manifest_integrity.js
      - name: i18n teardown unit tests
        run: node tests/test_i18n_teardown_unit.js
      - name: Compat 2.33.0 unit tests
        run: node tests/test_compat_233_unit.js
      - name: Compat version declaration tests
        run: node tests/test_compat_versions_unit.js
      - name: IPC authorization security tests (SEC-01..18)
        run: node tests/test_ipc_sec_unit.js
      - name: Updater IPC authorization tests (UPD-01..12)
        run: node tests/test_updater_auth_unit.js
